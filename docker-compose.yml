# Postgres + Metabase juntos.  Uso:  docker compose up -d
#   Metabase: http://localhost:3000
#   Postgres: so acessivel pelos containers; para DBeaver/psql use localhost:5433
# As senhas vem do arquivo .env (o compose le o .env automaticamente).
services:
  postgres:
    image: postgres:16
    container_name: postgres-siafi
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}   # senha do superusuario "postgres"
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5433:5432"       # so a sua maquina enxerga; 5433 evita conflito
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest   # fixe uma versao antes de usar de verdade
    container_name: metabase-siafi
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Sao_Paulo
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  metabase-data:
