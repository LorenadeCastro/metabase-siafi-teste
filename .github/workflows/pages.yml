# Publica a pasta docs/ no GitHub Pages a cada push na branch main.
name: Publicar documentação (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:          # permite rodar manualmente na aba Actions

# Permissões mínimas necessárias para publicar no Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações ao mesmo tempo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Gera o site com Jekyll (usa docs/_config.yml)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
